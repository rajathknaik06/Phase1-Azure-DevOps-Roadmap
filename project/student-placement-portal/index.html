<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Student Placement Portal Foundation</title>
  <meta name="description" content="A learning project: a static portal listing fictional students.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#results">Skip to results</a>

  <header class="site-header">
    <h1>Student Placement Portal</h1>
    <p>Foundation project - all students shown here are <strong>fictional</strong>.</p>
  </header>

  <main>
    <section aria-labelledby="search-heading" class="panel">
      <h2 id="search-heading">Find students</h2>
      <form id="filter-form" role="search" autocomplete="off">
        <div class="field">
          <label for="search-input">Search by name or skill</label>
          <input id="search-input" name="q" type="search" placeholder="e.g. Python, Azure, Meera">
        </div>
        <div class="field">
          <label for="course-select">Course</label>
          <select id="course-select" name="course">
            <option value="">All courses</option>
          </select>
        </div>
        <button type="reset" id="reset-button">Clear filters</button>
      </form>
    </section>

    <section aria-labelledby="results-heading">
      <h2 id="results-heading">Results</h2>
      <p id="status" role="status" aria-live="polite"></p>
      <ul id="results" class="cards"></ul>
      <noscript><p class="notice">This portal needs JavaScript to display student records.</p></noscript>
    </section>
  </main>

  <footer class="site-footer">
    <p>Phase 1 learning project. No real personal data. Data source: <span id="data-source">embedded sample data</span>.</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
